name: Refresh coding stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-coding-stats.mjs"
      - ".github/workflows/refresh-coding-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch live ratings
        run: node scripts/fetch-coding-stats.mjs
      - name: Commit stats.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "No stats change"
          else
            git commit -m "Refresh coding profile stats"
            git push
          fi
